<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body style="margin:0; overflow:hidden">
    <button id="btn" style="position:fixed; bottom:20px; left:50%; transform:translateX(-50%)">Старт AR</button>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera();
        scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        const reticle = new THREE.Mesh(
            new THREE.RingGeometry(0.1, 0.15, 32).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial({ color: 0x00ff88 })
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        const controller = renderer.xr.getController(0);
        controller.addEventListener("select", () => {
            if (!reticle.visible) return;
            const mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.2, 32), new THREE.MeshNormalMaterial());
            mesh.position.setFromMatrixPosition(reticle.matrix);
            mesh.position.y += 0.1;
            scene.add(mesh);
        });
        scene.add(controller);

        let hitTestSource = null, hitRequested = false;

        document.getElementById("btn").onclick = async () => {
            const session = await navigator.xr.requestSession("immersive-ar", { requiredFeatures: ["hit-test"] });
            await renderer.xr.setSession(session);
            document.getElementById("btn").style.display = "none";
            session.onend = () => { hitTestSource = null; hitRequested = false; document.getElementById("btn").style.display = ""; };
        };

        renderer.setAnimationLoop((t, frame) => {
            if (frame) {
                const session = renderer.xr.getSession();
                const refSpace = renderer.xr.getReferenceSpace();

                if (!hitRequested && session) {
                    session.requestReferenceSpace("viewer").then(vSpace => {
                        session.requestHitTestSource({ space: vSpace }).then(src => hitTestSource = src);
                    });
                    hitRequested = true;
                }

                if (hitTestSource && refSpace) {
                    const hits = frame.getHitTestResults(hitTestSource);
                    reticle.visible = hits.length > 0;
                    if (hits.length > 0) reticle.matrix.fromArray(hits[0].getPose(refSpace).transform.matrix);
                }
            }
            renderer.render(scene, camera);
        });
    </script>
</body>
</html>
