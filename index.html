<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Three.js WebXR Hit-test (ПР4)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: transparent; }
        #ar-btn { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 20; padding: 12px 24px; font-weight: bold; background: #007bff; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <button id="ar-btn">Войти в AR</button>
    <script>
        const params = new URLSearchParams(window.location.search), demo = params.get("demo"), arBtn = document.getElementById("ar-btn");
        let camera, scene, renderer, controller, reticle;
        let hitTestSource = null, hitTestSourceRequested = false;

        init();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            light.position.set(0.5, 1, 0.25);
            scene.add(light);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.12, 0.15, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            controller = renderer.xr.getController(0);
            controller.addEventListener("select", () => {
                if (reticle.visible) {
                    const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
                    reticle.matrix.decompose(p, q, s);
                    spawnObject(p, q);
                }
            });
            scene.add(controller);

            window.addEventListener("resize", () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            if (demo) setupDemo(demo); else setupWebXR();
            renderer.setAnimationLoop(render);
        }

        function setupDemo(mode) {
            arBtn.style.display = "none";
            camera.position.set(0, 1.2, 1.5);
            camera.lookAt(0, 0, -1.2);
            scene.add(new THREE.GridHelper(10, 20, 0x00ff88, 0x333333));
            reticle.visible = true;
            reticle.position.set(0, 0.01, -1.2);
            reticle.updateMatrix();
            if (mode === "placed") spawnObject(new THREE.Vector3(0, 0, -1.2));
        }

        function setupWebXR() {
            if (!("xr" in navigator)) return arBtn.disabled = true;
            navigator.xr.isSessionSupported("immersive-ar").then(sup => arBtn.disabled = !sup);

            arBtn.addEventListener("click", async () => {
                const session = await navigator.xr.requestSession("immersive-ar", {
                    requiredFeatures: ["hit-test"],
                    optionalFeatures: ["dom-overlay", "local-floor"],
                    domOverlay: { root: document.body }
                });

                renderer.xr.setReferenceSpaceType("local");
                await renderer.xr.setSession(session);
                arBtn.style.display = "none";

                session.addEventListener("end", () => {
                    hitTestSource = null;
                    hitTestSourceRequested = false;
                    arBtn.style.display = "block";
                });
            });
        }

        function spawnObject(p, q) {
            const mesh = new THREE.Mesh(
                new THREE.CylinderGeometry(0.1, 0.1, 0.25, 32),
                new THREE.MeshStandardMaterial({ color: 0x3388ff, roughness: 0.3, metalness: 0.2 })
            );
            mesh.position.copy(p);
            if (q) mesh.quaternion.copy(q);
            mesh.position.y += 0.125;
            scene.add(mesh);
        }

        function render(t, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested && session) {
                    session.requestReferenceSpace("viewer").then(viewerSpace => {
                        session.requestHitTestSource({ space: viewerSpace }).then(source => {
                            hitTestSource = source;
                        });
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource && referenceSpace) {
                    const hits = frame.getHitTestResults(hitTestSource);
                    if (hits.length > 0) {
                        reticle.visible = true;
                        reticle.matrix.fromArray(hits[0].getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
